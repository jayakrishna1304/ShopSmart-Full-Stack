spring.application.name=AIServicenew
server.port=8089

# MongoDB Configuration
spring.mongodb.uri=mongodb://localhost:27017/aidb

# ? THE FINAL GROQ FIX: The exact URL pattern that works perfectly with Spring AI's inner engine mapping
